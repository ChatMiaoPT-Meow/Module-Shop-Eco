modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Ar-Zhe/Module-Shop/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Module-Shop Eco ${mod_version} for Forge ${minecraft_version}"
displayURL="https://github.com/Ar-Zhe/Module-Shop"
logoFile="shop.png"
authors="${mod_authors}"
description='''
模块商店 Eco（Module Shop Eco 2.0）—— 面向 Forge 1.20.1 的阿尔比恩式闭环经济与生活职业系统：
官方闭环总钱箱、购物城供需动态定价与 10% 底仓做市、黑市满仓停收与缺货悬赏、82% 防套利硬锁、
八大生活职业与每日专注点精销、全模组零硬前置品质溢价、单向限额货币结汇，并完整包含每日商店、
每日收购、拍卖行、玩家摊位、玩家交易、邮箱、签到与公共 API 1.4.0（无缝兼容现有五大附属）。

A closed-loop market-maker economy & life-profession mod for Minecraft 1.20.1 / Forge 47.4.x:
official closed-loop treasury, dynamic supply/demand pricing, warehouse-full anti-dumping protection,
82% anti-arbitrage lock, 8 professions with daily Focus boost, soft-linked item quality bonuses,
one-way capped currency exchange, plus daily shop/buyback, auction house, player stalls, trading,
mailbox, check-ins, and Public API 1.4.0 (binary-compatible with existing Module Shop addons).
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# AtomLib：客户端 UI 前置（Skija 渲染桥 + 设计包），编译期锁定 0.4.0，运行期向上兼容 [0.1.0-beta,)。
# 专用服务器不需要安装。
[[dependencies.${mod_id}]]
    modId="atomlib"
    mandatory=true
    versionRange="${atomlib_version_range}"
    ordering="AFTER"
    side="CLIENT"
